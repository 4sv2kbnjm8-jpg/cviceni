<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cviky — Vizualizace</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body>
    <header class="topbar">
        <h1>Cviky</h1>
        <div class="controls">
            <input id="search" placeholder="Vyhledat název...">
            <select id="categoryFilter">
                <option value="">Všechny kategorie</option>
            </select>
            <button id="clear">Vyčistit</button>
        </div>
    </header>
    <main>
        <div id="cards" class="grid"></div>
    </main>

    <!-- Modal for video -->
    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button id="closeModal" class="close">✕</button>
            <div class="video-wrap">
                <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <a id="openExtern" class="openExtern" target="_blank">Otevřít v YouTube</a>
        </div>
    </div>

    <footer class="footer">Zdroj: Google Sheets — list "cviky"</footer>

    <script src="app.js"></script>
</body>

</html>
