<!doctype html>
<html lang="cs">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cviky — Vizualizace</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body>
    <header class="hero">
        <div class="hero-inner">
            <h1>🔋 Baterie cviků</h1>
            <p class="subtitle">Kompletní sada testovacích a tréninkových aktivit</p>

            <div class="search-wrap">
                <input id="search" class="search-input" placeholder="Vyhledat cviky...">
                <div class="pills" id="pills"></div>
                <div class="search-actions">
                    <button id="clear" class="btn ghost">Vyčistit</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="summary"><span id="countIcon">📊</span> <span id="countText">Načítám…</span></div>
            <div id="cards" class="grid"></div>
        </div>
    </main>

    <!-- Modal for video -->
    <div id="modal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button id="closeModal" class="close">✕</button>
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
            <div class="video-wrap">
                <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <a id="openExtern" class="openExtern" target="_blank">Otevřít v YouTube</a>
        </div>
    </div>

    <footer class="footer">Zdroj: Google Sheets — list "cviky"</footer>

    <script src="app.js"></script>
</body>

</html>
